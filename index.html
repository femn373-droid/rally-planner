/* ── v3.9 rally deadlines ──
   deadline      = スタンプ取得期限
   applyDeadline = 応募期限 (empty → same as deadline)
   Dates are compared as local "YYYY-MM-DD" strings, so the deadline day itself is still valid all day
   (new Date("YYYY-MM-DD") is UTC midnight = 9:00 JST, which used to expire rallies on the morning of the last day). */
const todayLocalStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const isPastDay = dateStr => !!dateStr && dateStr < todayLocalStr();
const applyDeadlineOf = r => r?.applyDeadline || r?.deadline || "";
// The deadline that matters next: stamp deadline while stamps can be collected, then the application deadline
const nextDeadlineOf = r => r?.deadline && !isPastDay(r.deadline) ? r.deadline : applyDeadlineOf(r);

// Filter stamp places to show only active (rallyId set + rally not expired) entries (E-④)
const filterActiveStampPlaces = (places, rallyMasters) => {
  if (!places || !places.length) return [];
  return places.filter(p => {
    if (!p.rallyId) return false;
    const rm = (rallyMasters || []).find(m => m.name === p.rallyId);
    if (!rm) return false;
    if (isPastDay(rm.deadline)) return false; // stamps can no longer be collected
    return true;
  });
};

// Summary for itinerary/print (filtered entries with rally info) (E-④)
const stampPlaceSummary = (places, rallyMasters) => {
  if (rallyMasters) {
    // New structured mode: filter active, show rally+medium+note
    const active = filterActiveStampPlaces(places, rallyMasters);
    return active.map(p => {
      const icon = methodStyle(p.type).icon;
      const dispName = rallyDisplayName(p.rallyId, rallyMasters);
      const mediumStr = p.medium ? "(" + p.medium + ")" : "";
      return icon + " " + dispName + mediumStr + (p.note ? " " + p.note : "");
    }).join("  ");
  }
  // Legacy fallback (no rallyMasters passed)
  return (places || []).filter(p => p.note).map(p => methodStyle(p.type).icon + " " + p.note).join("  ");
};

/* ── v3.9 MapCode ──

/* ── v3.7: expense tax handling ──
   Each row is either 見積 or 実績 (kind) with one amount and a tax rate.
   Totals everywhere use the tax-included amount (fractions rounded down per row). */
const TAX_RATES = [{
  value: "incl",
  label: "税込",
  rate: 0
}, {
  value: "8",
  label: "8%",
  rate: 8
}, {
  value: "10",
  label: "10%",
  rate: 10
}];
// Amounts are kept in 1/100 yen (integers) so fractions are not lost per row;
// they are rounded down only when a total is shown.
const taxIncludedCenti = (amount, taxRate) => {
  const r = TAX_RATES.find(t => t.value === taxRate)?.rate || 0;
  return Math.round(Math.round((Number(amount) || 0) * 100) * (100 + r) / 100);
};
// Total in 1/100 yen → whole yen, fractions rounded down (toward zero)
const centiToYen = c => c < 0 ? -Math.floor(-c / 100) : Math.floor(c / 100);
// One row's tax-included amount, fractions shown (e.g. ¥213.84)
const fmtYenExact = c => {
  const a = Math.abs(c),
    y = Math.floor(a / 100),
    f = a % 100;
  return `${c < 0 ? "-" : ""}¥${y.toLocaleString()}${f ? "." + String(f).padStart(2, "0") : ""}`;
};
// Tax-included amount (1/100 yen) of a row if it belongs to the given kind ("budget" | "actual"), else 0
const expCenti = (e, kind) => (e.kind || "budget") === kind ? taxIncludedCenti(e.amount, e.taxRate) : 0;
const expHasAmount = (e, kind) => (e.kind || "budget") === kind && e.amount !== "" && e.amount != null;

// Old rows held both 見積 and 実績 in one row (both tax-included) → one row per filled side
const migrateExpenses = spot => {
  if (!Array.isArray(spot.expenses)) return spot;
  if (!spot.expenses.some(e => e.kind === undefined)) return spot;
  const out = [];
  spot.expenses.forEach(e => {
    if (e.kind !== undefined) {
      out.push(e);
      return;
    }
    const {
      budget,
      actual,
      ...rest
    } = e;
    const hasB = budget !== "" && budget != null,
      hasA = actual !== "" && actual != null;
    if (hasB) out.push({
      ...rest,
      kind: "budget",
      amount: String(budget),
      taxRate: "incl"
    });
    if (hasA) out.push({
      ...rest,
      id: hasB ? uid() : rest.id,
      kind: "actual",
      amount: String(actual),
      taxRate: "incl"
    });
    if (!hasB && !hasA) out.push({
      ...rest,
      kind: "budget",
      amount: "",
      taxRate: "incl"
    });
  });
  spot.expenses = out;
  return spot;
};

/* ── Aggregate expense badges by category (tax-included) ── */
const aggregateExpenses = (expenses, field) => {
  const map = {};
  (expenses || []).forEach(e => {
    if (!e.cat) return;
    const val = expCenti(e, field);
    if (!map[e.cat]) map[e.cat] = 0;
    map[e.cat] += val;
  });
  // Return entries where at least one expense exists for this cat
  return Object.entries(map).filter(([cat]) => (expenses || []).some(e => e.cat === cat && expHasAmount(e, field))).map(([cat, total]) => ({
    cat,
    total: Math.max(0, centiToYen(total))
  }));
};

})();

/* ── Time helpers ── */
const parseTime = s => {
  if (!s) return null;
  const m = s.match(/^(\d{1,2}):(\d{2})$/);
  return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : null;
};
const fmtClock = mins => {
  if (mins == null || isNaN(mins)) return "";
  const wrapped = (mins % 1440 + 1440) % 1440;
  const h = Math.floor(wrapped / 60);
  const m = wrapped % 60;
  return `${h}:${String(m).padStart(2, "0")}`;
};
const addTimes = (clockStr, durStr) => {
  const c = parseTime(clockStr);
  const d = parseTime(durStr);
  if (c == null || d == null) return "";
  return fmtClock(c + d);
};

/* ── v3.7: keep the element being worked on in view across expand / collapse ──
   Call right before the state change that opens or closes a card. After the re-render,
   the element is put back where it was on screen, clamped so that it stays below the
   sticky tab bar and (with center) no lower than the middle of the visible area.
   This cancels the jump caused by another card above it collapsing at the same time. */
const stickyTabBarHeight = () => document.querySelector("[data-sticky-tabs]")?.offsetHeight || 0;
const keepInView = (el, {
  center = true
} = {}) => {
  if (!el) return;
  const before = el.getBoundingClientRect().top;
  requestAnimationFrame(() => {
    if (!el.isConnected) return;
    const minTop = stickyTabBarHeight() + 8;
    const maxTop = center ? Math.max(minTop, minTop + (window.innerHeight - minTop) / 2 - el.offsetHeight / 2) : Infinity;
    const target = Math.min(Math.max(before, minTop), maxTop);
    const now = el.getBoundingClientRect().top;
    if (Math.abs(now - target) > 1) window.scrollBy(0, now - target);
  });
};

/* ── v3.7: spot name index — normalized name AND registered aliases (表記ゆれ) → spot master ──
   Real names take priority over aliases when both collide. */
const buildSpotNameIndex = spotMasters => {
  const map = new Map();
  (spotMasters || []).forEach(m => {
    if (m.name) {
      const k = normalizeSpotName(m.name);
      if (!map.has(k)) map.set(k, m);
    }
  });
  (spotMasters || []).forEach(m => (m.nameAliases || []).forEach(a => {
    if (a) {
      const k = normalizeSpotName(a);
      if (!map.has(k)) map.set(k, m);
    }
  }));
  return map;
};
// v3.8: combine two spotTags entries for merged spots (per-axis objects; the kept spot wins per axis)
const mergeSpotTagEntry = (keep, other) => {
  if (keep && typeof keep === "object" && other && typeof other === "object") return {
    ...other,
    ...keep
  };
  return keep !== undefined && keep !== null && keep !== "" ? keep : other;
};
const findSpotByName = (index, name) => name ? index.get(normalizeSpotName(name)) || null : null;

/* ── v3.7: per-rally collected stamps (single source for counts / ✓ / tag progress) ──
   Sources:
     trip — stamp entries checked 取得済 in any saved trip (+ the open trip)
     off  — the rally's offTripStamps (registered-spot ✓ adds one here)
   A spot collected by both is counted once. Entries that match no spot master are
   counted by name (trip) or one by one (off, without name). */
const buildRallyCollection = (rallyMasters, spotMasters, tripEntries) => {
  const byNorm = buildSpotNameIndex(spotMasters);
  const byId = new Map();
  (spotMasters || []).forEach(m => byId.set(m.id, m));
  const out = {};
  const get = rn => out[rn] || (out[rn] = {
    spotIds: new Map(),
    anonNames: new Set(),
    anonOff: 0
  });
  (tripEntries || []).forEach(e => {
    if (!e.rallyName) return;
    const c = get(e.rallyName);
    const norm = e.spotName ? normalizeSpotName(e.spotName) : "";
    const m = norm ? byNorm.get(norm) : null;
    if (m) c.spotIds.set(m.id, "trip");else if (norm) c.anonNames.add(norm);else c.anonOff++;
  });
  (rallyMasters || []).forEach(r => {
    if (!r.name) return;
    const c = get(r.name);
    (r.offTripStamps || []).forEach(os => {
      const m = os.spotId && byId.get(os.spotId) || (os.spotName ? byNorm.get(normalizeSpotName(os.spotName)) : null);
      if (m) {
        if (!c.spotIds.has(m.id)) c.spotIds.set(m.id, "off");
      } else if (os.spotName) c.anonNames.add("off:" + normalizeSpotName(os.spotName));else c.anonOff++;
    });
  });
  Object.values(out).forEach(c => {
    let trip = 0,
      off = 0;
    c.spotIds.forEach(src => {
      src === "trip" ? trip++ : off++;
    });
    c.anonNames.forEach(n => {
      n.startsWith("off:") ? off++ : trip++;
    });
    off += c.anonOff;
    c.tripCount = trip;
    c.offCount = off;
    c.count = trip + off;
  });
  return out;
};

// Collected stamp entries of one trip: [{ rallyName, spotName }]

/* ── v3.7②: stamp entry ← master helpers ── */
// Spot master's stampPlaces entry for a given rally (rallyId holds the rally name)
const findStampPlace = (master, rallyName) => {
  if (!master?.stampPlaces?.length) return null;
  return master.stampPlaces.find(sp => sp.rallyId === rallyName) || null;
};
const findStampNote = (master, rallyName) => findStampPlace(master, rallyName)?.note || "";

// Master-derived fields of a stamp entry.
// medium: rally master first, then the spot master's per-place medium as fallback.
const stampMasterFields = (master, rallyName, rm) => ({
  medium: rm?.medium || findStampPlace(master, rallyName)?.medium || "",
  stampNote: findStampNote(master, rallyName),
  stampNumber: master?.id && rm?.spotNumbers?.[master.id] || findStampPlace(master, rallyName)?.number || ""
});

// Fill master-derived fields into existing entries, only where they are still empty
// (anything typed on site is kept).
const fillStampMasterFields = (stamps, master, rallyMasters) => stamps.map(st => {
  if (!st.rallyName) return st;
  const rm = (rallyMasters || []).find(m => m.name === st.rallyName);
  const f = stampMasterFields(master, st.rallyName, rm);
  const patch = {};
  Object.keys(f).forEach(k => {
    if (!st[k] && f[k]) patch[k] = f[k];
  });
  return Object.keys(patch).length ? {
    ...st,
    ...patch
  } : st;
});

/* ── v3.8 multi-axis tags ──
   rally.tagGroups: [{ id, name, values }]
   rally.spotTags:  { spotId: { [groupId]: value } }
   counts / totals: { [groupId]: { [value]: n } } */
const newTagGroupId = () => "tg_" + Math.random().toString(36).slice(2, 8);
const tagGroupsOf = rally => (rally?.tagGroups || []).filter(Boolean);
const spotTagOf = (rally, spotId, groupId) => {
  const v = rally?.spotTags?.[spotId];
  return v && typeof v === "object" ? v[groupId] || "" : "";
};
// Axis a condition refers to (older conditions have no groupId → first axis)
const condGroup = (cond, groups) => groups.find(g => g.id === cond.groupId) || groups[0] || null;
// Tags with at least one value, in order: [{ group, value }]
const spotTagList = (rally, spotId) => tagGroupsOf(rally).map(g => ({
  group: g,

const computeTagCounts = (rally, spotMasters, collectedIds) => {
  const groups = tagGroupsOf(rally);
  if (!groups.length) return {};
  const counts = {};
  groups.forEach(g => {
    counts[g.id] = {};
    (g.values || []).forEach(v => {
      counts[g.id][v] = 0;
    });
  });
  (spotMasters || []).filter(m => (m.rallyNames || []).includes(rally.name)).forEach(sp => {
    if (!collectedIds?.has(sp.id)) return;
    groups.forEach(g => {
      const v = spotTagOf(rally, sp.id, g.id);
      if (v) counts[g.id][v] = (counts[g.id][v] || 0) + 1;
    });
  });
  return counts;
};

const isTierConditionMet = (tier, totalCollected, tagCounts, tagGroups) => {
  const groups = tagGroups || [];
  const conditions = getTierConditions(tier);
  return conditions.every(cond => {
    const req = parseInt(cond.required) || 0;
    if (req <= 0) return true;
    const ct = cond.conditionType || "total";
    if (ct === "total") return totalCollected >= req;
    const g = condGroup(cond, groups);
    if (!g) return totalCollected >= req;
    const cnt = tagCounts?.[g.id] || {};
    if (ct === "eachTag") {
      if (!g.values?.length) return totalCollected >= req;
      return g.values.every(v => (cnt[v] || 0) >= req);
    }
    if (ct === "specificTag") return (cnt[cond.tagValue] || 0) >= req;
    return totalCollected >= req;
  });
};

// Summarize tier conditions as display text
const tierConditionSummary = (tier, tagGroups) => {
  const groups = tagGroups || [];
  const conds = getTierConditions(tier);
  return conds.map(c => {
    const req = parseInt(c.required) || 0;
    if (req <= 0) return null;
    const g = condGroup(c, groups);
    if (c.conditionType === "eachTag") return `各${g?.name || "タグ"}${req}以上`;
    if (c.conditionType === "specificTag") return `${c.tagValue}${req}以上`;
    return `合計${req}以上`;
  }).filter(Boolean).join(" ＋ ");
};

// v3.8: per-axis progress for one spot on an itinerary card:
// collected outside this trip + this trip's spots up to `position`. → [{ group, value, count, total }]
const tagProgressForSpot = (rm, sm, spotMasters, rallyCollection, tripSpotMasterIds, position) => {
  if (!rm || !sm) return [];
  const tripPos = (tripSpotMasterIds || new Map()).get(rm.name) || new Map();
  const got = rallyCollection?.[rm.name]?.spotIds;
  const rallySpots = (spotMasters || []).filter(m => (m.rallyNames || []).includes(rm.name));
  return spotTagList(rm, sm.id).map(({
    group,
    value
  }) => {
    const same = rallySpots.filter(m => spotTagOf(rm, m.id, group.id) === value);
    const count = same.filter(m => got?.has(m.id) || tripPos.has(m.id) && tripPos.get(m.id) <= position).length;
    return {
      group,
      value,
      count,
      total: same.length
    };
  });
};

  const sorted = [..._yomiDict].sort((a, b) => b.kanji.length - a.kanji.length);
  for (const entry of sorted) {
    if (!entry.kanji) continue;
    n = n.replace(new RegExp(escapeRegExp(entry.kanji), "g"), entry.yomi);

  n = kata2hira(n);
  n = n.toLowerCase();
  return n;
};

        model: "claude-sonnet-4-6",
        max_tokens: 16000,
        messages

          if (st.rallyIndex === idx && st.rallyTotal === total) return st;
          changed++;
          return {
            ...st,
            rallyIndex: idx,
            rallyTotal: total
          };
        })
      };
    });
    if (changed) setTrip(prev => ({
      ...prev,
      spots
    }));
    setRenumberMsg(changed ? `✓ ${changed}件の番号を振り直しました` : "✓ 番号はすでに最新です");
    setTimeout(() => setRenumberMsg(""), 3000);
  }, [trip, rallyMasters]);
  const applyMasterToSpot = useCallback((spotId, master) => {
    setTrip(prev => {
      // Highest stamp index already used per rally in this trip
      const maxIdx = {};
      prev.spots.forEach(s => (s.stamps || []).forEach(st => {
        if (!st.rallyName) return;
        const i = parseInt(st.rallyIndex) || 0;
        if (i > (maxIdx[st.rallyName] || 0)) maxIdx[st.rallyName] = i;
      }));
      return {
        ...prev,
        spots: prev.spots.map(s => {
          if (s.id !== spotId) return s;

          // Pull the rallies this spot belongs to into its stamp list
          // (existing entries get empty medium / note / number filled from masters)
          const stamps = fillStampMasterFields(s.stamps || [], master, rallyMasters);
          const have = new Set(stamps.map(st => st.rallyName).filter(Boolean));
          (master.rallyNames || []).forEach(rn => {
            if (!rn || have.has(rn)) return;
            const rm = rallyMasters.find(m => m.name === rn);
            const total = rallyStampTotal(rm);
            const base = rallyBaseCountRef.current[rn] || 0; // collected outside this trip
            const next = Math.max(maxIdx[rn] || 0, base) + 1;
            maxIdx[rn] = next;
            const newEntry = makeStampEntry({
              rallyName: rn,
              rallyTotal: String(total || ""),
              rallyIndex: String(next),
              stampMethod: rm?.method || "physical",
              ...stampMasterFields(master, rn, rm)
            });
            // If there's an empty stamp slot (no rally assigned), overwrite it
            const emptyIdx = stamps.findIndex(st => !st.rallyName);
            if (emptyIdx !== -1) {
              stamps[emptyIdx] = newEntry;
            } else {
              stamps.push(newEntry);
            }
            have.add(rn);
          });
          return {
            ...s,
            name: master.name,
            navTarget: master.navTarget || s.navTarget,
            address: master.address || s.address,
            hoursOpen: master.hoursOpen || s.hoursOpen,
            hoursClose: master.hoursClose || s.hoursClose,
            is24h: master.is24h ?? s.is24h,
            closedDay: master.closedDay || s.closedDay,
            stampPlaces: master.stampPlaces?.length ? master.stampPlaces : s.stampPlaces || [],
            stamps

        })
      };
    });

    setSpotMasters(prev => {

      const idx = new Map();
      next.forEach((m, i) => {
        if (m.name) {
          const k = normalizeSpotName(m.name);
          if (!idx.has(k)) idx.set(k, i);
        }
      });
      next.forEach((m, i) => (m.nameAliases || []).forEach(a => {
        if (a) {
          const k = normalizeSpotName(a);
          if (!idx.has(k)) idx.set(k, i);
        }
      }));
      for (const s of list) {
        if (!s.name) continue;
        const normKey = normalizeSpotName(s.name);
        const i = idx.get(normKey);
        if (i !== undefined) {
          const m = next[i];
          next[i] = {
            ...m,
            pref: m.pref || s.pref,
            category: m.category || s.category,
            address: m.address || s.address,
            stampPlaces: m.stampPlaces?.length ? m.stampPlaces : s.stampPlace ? [{

            yomi: m.yomi || guessYomi(m.name),

            type: "physical",
            note: s.stampPlace
          }];
          delete overrides.stampPlace;

      const actualExpBadges = aggregateExpenses(spot.expenses, "actual").map(({

      }).join(" ");

      const mc = spot.name ? spotMasters.find(m => m.name && normalizeSpotName(m.name) === normalizeSpotName(spot.name))?.mapCode || "" : "";
      const pSkipStyle = pSkip ? ' style="opacity:0.3"' : '';

      spotsHTML += `

          ${spot.address ? `<span class="sub">🏠${spot.address}</span>` : ""}

        </td></tr>

          <td>${i === 0 ? '—' : pSkip ? '' : spot.planTime || ''}</td>
          <td>${i === 0 ? '—' : pSkip ? '' : spot.planDist ? spot.planDist + 'km' : ''}</td>
          <td>${i === 0 ? '—' : pSkip ? '' : pArr}</td>
          <td>${i === 0 ? '—' : pSkip ? '' : spot.planStay || ''}</td>
          <td>${pSkip ? '' : pDep}</td>

        <tr class="actual"${aSkipStyle}><td></td><td>実績${aSkip ? ' <span class="badge" style="background:#a0aec0">SKIP</span>' : ''}</td>
          <td class="${spot.actualEstimated ? 'est' : 'conf'}">${i === 0 ? '—' : aSkip ? '' : aDriveTime}</td>
          <td class="${spot.actualEstimated ? 'est' : 'conf'}">${i === 0 ? '—' : aSkip ? '' : aSegDist != null && aSegDist >= 0 ? aSegDist.toFixed(1) + 'km' : ''}</td>
          <td class="${spot.actualEstimated ? 'est' : 'conf'}">${i === 0 ? '—' : aSkip ? '' : aArr}</td>
          <td class="${spot.actualEstimated ? 'est' : 'conf'}">${i === 0 ? '—' : aSkip ? '' : aStay}</td>
          <td class="${spot.actualEstimated ? 'est' : 'conf'}">${i === 0 ? '' : aSkip ? '' : aDep}</td>
          <td class="${cumDistClass}">${i === 0 ? '—' : printCumDist ? printCumDist + 'km' : ''}</td>
          <td>${aSkip ? '' : actualExpBadges}</td></tr>`;
    });

    // Expense summary
    const expTotals = {};
    EXPENSE_CATS.forEach(c => {
      expTotals[c.key] = {
        b: 0,
        a: 0
      };

    trip.spots.forEach(s => (s.expenses || []).forEach(e => {
      if (e.cat && expTotals[e.cat]) {
        expTotals[e.cat].b += expCenti(e, "budget");
        expTotals[e.cat].a += expCenti(e, "actual");
      }
    }));
    // grand totals from the unrounded sums, then round each line down once
    const gb = centiToYen(Object.values(expTotals).reduce((s, t) => s + t.b, 0));
    const ga = centiToYen(Object.values(expTotals).reduce((s, t) => s + t.a, 0));
    Object.values(expTotals).forEach(t => {
      t.b = centiToYen(t.b);
      t.a = centiToYen(t.a);

    let expHTML = EXPENSE_CATS.map(c => {
      const t = expTotals[c.key];
      return `<tr><td><span class="badge" style="background:${c.bg}">${c.label}</span></td><td>¥${t.b.toLocaleString()}</td><td>¥${t.a.toLocaleString()}</td><td>${t.a - t.b < 0 ? '-' : ''}¥${Math.abs(t.a - t.b).toLocaleString()}</td></tr>`;
    }).join("");

    // Expense detail list for print
    let expDetailHTML = "";
    trip.spots.forEach((spot, i) => {
      (spot.expenses || []).forEach(exp => {
        if (exp.cat || exp.note || exp.amount !== "" && exp.amount != null) {
          const ci = catMap[exp.cat];
          const pb = expCenti(exp, "budget"),
            pa = expCenti(exp, "actual");
          expDetailHTML += `<tr>
            <td style="text-align:center;font-weight:600">${i + 1}</td>
            <td>${spot.name || '(未設定)'}</td>
            <td>${ci ? `<span class="badge" style="background:${ci.bg}">${ci.label}</span>` : ''}</td>
            <td>${exp.note || ''}</td>
            <td style="text-align:right;color:#2c5282">${pb !== 0 ? fmtYenExact(pb) : ''}</td>
            <td style="text-align:right;color:#c53030">${pa !== 0 ? fmtYenExact(pa) : ''}</td>
            <td>${exp.payMethod || ''}</td>
          </tr>`;
        }
      });
    });

    // Blank rows for handwriting (20 rows)
    let blankRowsHTML = "";
    for (let r = 0; r < 20; r++) {
      blankRowsHTML += `<tr><td style="height:20px"></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
    }
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${trip.name}</title>
    <style>
      body { font-family: 'Noto Sans JP', sans-serif; font-size: 11px; margin: 10px; }
      h2 { margin: 0 0 4px; font-size: 16px; }
      .meta { color: #666; margin-bottom: 8px; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }

      .spot-header td { background: #f0f0f0; border-bottom: none; }

      .actual td { border-bottom: 2px solid #999; }
      .conf { color: #c53030; }
      .est { color: #2b6cb0; }

      .phys { background: #2c5282; }
      .gps { background: #276749; }

      .event { background: #e53e3e; }

      .sub { font-size: 10px; color: #888; margin-left: 8px; }
      .note { font-size: 10px; color: #c53030; margin-left: 4px; }
      .imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      .imgs figure { margin: 0; width: 48%; page-break-inside: avoid; }
      .imgs img { width: 100%; height: auto; border: 1px solid #ccc; display: block; }
      .imgs figcaption { font-size: 10px; color: #c53030; font-weight: 600; }
      .exp-table { max-width: 400px; }
      .exp-table th { background: #f0f0f0; }

      strong { font-size: 13px; }
      @media print { body { margin: 5mm; } .page-break { page-break-before: always; } }
    </style></head><body>
    <h2>${trip.name || '無題'}</h2>
    <div class="meta">${trip.date} ｜ 出発: ${trip.startLocation} 予定${trip.startTime}${trip.actualStartTime ? ` 実績${trip.actualStartTime}` : ''} ｜ 総距離: ${planTotalDist.toFixed(1)}km</div>
    <table><thead><tr><th></th><th width="36"></th><th>時間</th><th>距離</th><th>到着</th><th>滞在</th><th>出発</th><th>累計</th><th>費用</th></tr></thead>
    <tbody>${spotsHTML}</tbody></table>
    <h3>費用集計</h3>
    <table class="exp-table"><thead><tr><th>区分</th><th>見積</th><th>実績</th><th>差額</th></tr></thead>
    <tbody>${expHTML}<tr style="font-weight:bold;border-top:2px solid #333"><td>合計</td><td>¥${gb.toLocaleString()}</td><td>¥${ga.toLocaleString()}</td><td>${ga - gb < 0 ? '-' : ''}¥${Math.abs(ga - gb).toLocaleString()}</td></tr></tbody></table>
    ${expDetailHTML ? `<h3>費用明細（予定）</h3>
    <table class="detail-table"><thead><tr><th style="width:24px">#</th><th>場所</th><th style="width:50px">区分</th><th>内容</th><th style="width:60px">見積</th><th style="width:60px">実績</th><th style="width:60px">支払</th></tr></thead>
    <tbody>${expDetailHTML}</tbody></table>` : ''}
    <div class="page-break"></div>
    <h3>費用メモ（実績記入用）</h3>
    <table class="detail-table"><thead><tr><th style="width:60px">日時</th><th style="width:24px">#</th><th>場所</th><th style="width:50px">区分</th><th>内容</th><th style="width:60px">金額</th><th style="width:60px">支払</th></tr></thead>
    <tbody>${blankRowsHTML}</tbody></table>
    </body></html>`;

    // Download as HTML file (open in browser → print)
    const blob = new Blob([html], {
      type: "text/html"
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${trip.name || "trip"}_${trip.date || "nodate"}_印刷用.html`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // JSON Import
  const importJSON = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const data = JSON.parse(ev.target.result);

        // v2/v3/v4 format: { version, trip: {...}, rallyMasters: [...], spotMasters: [...] }
        if ([2, 3, 4, 5, 6, 7].includes(data.version) && data.trip && Array.isArray(data.trip.spots)) {
          // v7: restore images this browser does not have yet (before the trip shows them)
          if (Array.isArray(data.images) && data.images.length) await importImageRecords(data.images).catch(() => {});
          const imported = {
            ...data.trip,
            id: data.trip.id || uid(),
            updatedAt: Date.now()
          };
          if (imported.spots) imported.spots.forEach(s => {
            migrateStampPlace(s);
            migrateExpenses(s);
          });
          setTrip(imported);

          // Merge spot masters by normalized name + ID dedup
          if (Array.isArray(data.spotMasters) && data.spotMasters.length > 0) {
            setSpotMasters(prev => {
              const merged = [...prev];
              // Use normalizeSpotName for fuzzy matching (handles spaces, dots, parens, etc.)
              const normNameMap = new Map(prev.map(s => [normalizeSpotName(s.name), s]));
              const idSet = new Set(prev.map(s => s.id));
              for (const incoming of normalizeSpotMasters(data.spotMasters)) {
                if (!incoming.name) continue;
                const normName = normalizeSpotName(incoming.name);
                const existing = normNameMap.get(normName);
                if (existing) {
                  // Merge: keep existing ID, update data, preserve nameAliases
                  const idx = merged.findIndex(s => s.id === existing.id);
                  if (idx >= 0) {
                    const aliases = new Set([...(existing.nameAliases || []), ...(incoming.nameAliases || [])]);
                    // Add name variant as alias if different
                    if (incoming.name !== existing.name) aliases.add(incoming.name);
                    merged[idx] = {
                      ...incoming,
                      id: existing.id,
                      nameAliases: [...aliases].filter(Boolean),
                      images: unionImageRefs(existing.images, incoming.images)
                    };
                  }
                } else if (idSet.has(incoming.id)) {
                  // ID collision but different normalized name — assign new unique ID
                  const newId = uid();
                  merged.push({
                    ...incoming,
                    id: newId
                  });
                  normNameMap.set(normName, {
                    ...incoming,
                    id: newId
                  });
                  idSet.add(newId);
                } else {
                  merged.push({
                    ...incoming,
                    id: incoming.id || uid()
                  });
                  normNameMap.set(normName, incoming);
                  idSet.add(incoming.id);
                }
              }
              return deduplicateSpotMasters(merged);
            });
          }

          // Merge rally masters: import new ones, update existing by name
          if (Array.isArray(data.rallyMasters) && data.rallyMasters.length > 0) {
            setRallyMasters(prev => {
              const merged = [...prev];
              const nameMap = new Map(prev.map(m => [m.name, m]));
              let added = 0,
                updated = 0;
              for (const incoming of data.rallyMasters.map(migrateRallyTags)) {
                if (!incoming.name) continue;
                const existing = nameMap.get(incoming.name);
                if (existing) {
                  // Update existing master with imported data
                  const idx = merged.findIndex(m => m.id === existing.id);
                  if (idx >= 0) {
                    merged[idx] = {
                      ...incoming,
                      id: existing.id
                    };
                    updated++;
                  }
                } else {
                  // Add new master
                  merged.push({
                    ...incoming,
                    id: incoming.id || uid()
                  });
                  added++;
                }
              }
              const msg = [];
              if (added > 0) msg.push(`${added}件追加`);
              if (updated > 0) msg.push(`${updated}件更新`);
              setSaveStatus(`インポート完了（ラリー: ${msg.join("・") || "変更なし"}）`);
              return merged;
            });
          } else {
            setSaveStatus("インポート完了");
          }
          setView("editor");
          setTimeout(() => setSaveStatus(""), 3000);

          // Legacy format: trip object directly with spots array
        } else if (data.spots && Array.isArray(data.spots)) {
          const imported = {
            ...data,
            id: data.id || uid(),
            updatedAt: Date.now()
          };
          setTrip(imported);
          setView("editor");
          setSaveStatus("インポート完了（旧形式）");
          setTimeout(() => setSaveStatus(""), 2000);
        } else {
          alert("有効な旅程データではありません");
        }
      } catch {
        alert("JSONの読み込みに失敗しました");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  // Collect all used rally names for autocomplete (including masters)
  const rallyNames = useMemo(() => {
    const names = new Set();
    rallyMasters.forEach(m => {
      if (m.name) names.add(m.name);
    });
    trip.spots.forEach(s => {
      (s.stamps || []).forEach(st => {
        if (st.rallyName) names.add(st.rallyName);
      });
    });
    return Array.from(names).sort();
  }, [trip.spots, rallyMasters]);

  // === v3.5 perf fix: pre-compute normalized name lookup & trip spot IDs ===
  // v3.7: when an alias is added / removed, merge spots it now identifies (name typing doesn't trigger this)
  const aliasSignature = useMemo(() => spotMasters.map(m => (m.nameAliases || []).join("\u0001")).join("\u0002"), [spotMasters]);
  useEffect(() => {
    if (loading) return;
    setSpotMasters(prev => deduplicateSpotMasters(prev));
  }, [aliasSignature, loading]);

  // v3.7: rally data keyed by spot id → follow spots that were merged into another
  useEffect(() => {
    if (loading || _spotIdRemap.size === 0) return;
    let changed = false;
    const remapKeys = obj => {
      if (!obj) return obj;
      let hit = false;
      const out = {};
      Object.entries(obj).forEach(([k, v]) => {
        const nk = resolveSpotId(k);
        if (nk !== k) hit = true;
        if (nk === k) out[nk] = mergeSpotTagEntry(v, out[nk]);else out[nk] = mergeSpotTagEntry(out[nk] ?? obj[nk], v);
      });
      if (!hit) return obj;
      changed = true;
      return out;
    };
    const next = rallyMasters.map(r => {
      const spotTags = remapKeys(r.spotTags);
      const spotNumbers = remapKeys(r.spotNumbers);
      let offHit = false;
      const offTripStamps = (r.offTripStamps || []).map(os => {
        const nid = os.spotId ? resolveSpotId(os.spotId) : os.spotId;
        if (nid === os.spotId) return os;
        offHit = true;
        const m = spotMasters.find(x => x.id === nid);
        return {
          ...os,
          spotId: nid,
          spotName: m?.name || os.spotName
        };
      });
      if (offHit) changed = true;
      return spotTags !== r.spotTags || spotNumbers !== r.spotNumbers || offHit ? {
        ...r,
        spotTags,
        spotNumbers,
        offTripStamps
      } : r;
    });
    if (changed) setRallyMasters(next);
  }, [spotMasters, rallyMasters, loading]);

  // v3.7: also resolves registered aliases (表記ゆれ)
  const normNameToMaster = useMemo(() => buildSpotNameIndex(spotMasters), [spotMasters]);
  const spotNameIndex = normNameToMaster;

  // v3.7: collected stamps per rally — other saved trips (loaded when the trip set changes)
  // plus the open trip (live, so checks show up without waiting for auto-save)
  const [otherTripEntries, setOtherTripEntries] = useState(null);
  const otherTripsKey = trip.id + "|" + tripIndex.map(e => e.id).join(",");
  useEffect(() => {
    if (loading) return;
    let cancelled = false;
    (async () => {
      const list = [];
      for (const entry of tripIndex) {
        if (entry.id === trip.id) continue;
        const t = await loadTrip(entry.id);
        if (t) list.push(...collectedEntriesOfTrip(t));
      }
      if (!cancelled) setOtherTripEntries(list);
    })();
    return () => {
      cancelled = true;
    };
  }, [otherTripsKey, loading]);
  const currentTripEntries = useMemo(() => collectedEntriesOfTrip(trip), [trip.spots]);
  // v3.7: what is already collected OUTSIDE the open trip — the starting point for this trip's
  // stamp numbers (n / total) and tag progress
  const rallyCollectionBase = useMemo(() => buildRallyCollection(rallyMasters, spotMasters, otherTripEntries || []), [rallyMasters, spotMasters, otherTripEntries]);
  const rallyBaseCount = useMemo(() => {
    const out = {};
    Object.entries(rallyCollectionBase).forEach(([rn, c]) => {
      out[rn] = c.count;
    });
    return out;
  }, [rallyCollectionBase]);
  rallyBaseCountRef.current = rallyBaseCount;
  const rallyCollection = useMemo(() => buildRallyCollection(rallyMasters, spotMasters, [...(otherTripEntries || []), ...currentTripEntries]), [rallyMasters, spotMasters, otherTripEntries, currentTripEntries]);

  // v3.7 one-time migration: registered-spot ✓ used to mean visitCount > 0.
  // Spots of a rally that were ✓ that way but not collected in any trip become off-trip stamps.
  useEffect(() => {
    if (loading || otherTripEntries === null) return;
    if (!rallyMasters.some(r => !r.collectionMigrated)) return;
    setRallyMasters(prev => prev.map(r => {
      if (r.collectionMigrated) return r;
      if (!r.name) return {
        ...r,
        collectionMigrated: true
      };
      const got = rallyCollection[r.name]?.spotIds || new Map();
      const add = spotMasters.filter(sp => (sp.rallyNames || []).includes(r.name) && (sp.visitCount || 0) > 0 && !got.has(sp.id)).map(sp => makeOffTripStamp({
        date: "",
        spotId: sp.id,
        spotName: sp.name,
        spotNumber: r.spotNumbers?.[sp.id] || "",
        memo: "訪問記録から移行"
      }));
      return {
        ...r,
        offTripStamps: [...(r.offTripStamps || []), ...add],
        collectionMigrated: true
      };
    }));
  }, [loading, otherTripEntries, rallyMasters]);

  // rallyName → Map(spotMasterId → first position in this trip); tag progress counts
  // only the trip's spots up to the card being shown (v3.7)
  const tripSpotMasterIds = useMemo(() => {
    const map = new Map();
    (trip.spots || []).forEach((ts, pos) => {
      const tsm = ts.name ? normNameToMaster.get(normalizeSpotName(ts.name)) : null;
      (ts.stamps || []).forEach(st => {
        if (st.rallyName) {
          if (!map.has(st.rallyName)) map.set(st.rallyName, new Map());
          const m = map.get(st.rallyName);
          if (tsm && !m.has(tsm.id)) m.set(tsm.id, pos);
        }
      });
    });
    return map;
  }, [trip.spots, normNameToMaster]);

  // Rally stats: for each rally name, track maxIndex, total, and method for auto-fill
  // Masters take priority for total and method
  // total = target tier's required count (or master's totalSpots if no target)
  // maxIndex starts from stamps already collected outside this trip (other trips + off-trip, v3.7)
  const rallyStats = useMemo(() => {
    const stats = {};
    // Seed from masters
    rallyMasters.forEach(m => {
      if (!m.name) return;
      const total = rallyStampTotal(m);
      stats[m.name] = {
        maxIndex: rallyBaseCount[m.name] || 0,
        total,
        method: m.method || "physical"
      };
    });
    // Overlay from trip data (maxIndex tracks highest used index across trips)
    trip.spots.forEach(s => {
      (s.stamps || []).forEach(st => {
        if (!st.rallyName) return;
        const idx = parseInt(st.rallyIndex) || 0;
        if (!stats[st.rallyName]) {
          stats[st.rallyName] = {
            maxIndex: idx,
            total: st.rallyTotal || "",
            method: st.stampMethod || "physical"
          };
        } else {
          if (idx > stats[st.rallyName].maxIndex) stats[st.rallyName].maxIndex = idx;
        }
      });
    });
    return stats;
  }, [trip.spots, rallyMasters, rallyBaseCount]);

  /* ── Diff two clock strings in minutes ── */
  const diffTimes = (from, to) => {
    const f = parseTime(from),
      t = parseTime(to);
    if (f == null || t == null) return null;
    return t - f;
  };

  /* ── Calculate plan/actual arrival/departure ── */
  const calculations = useMemo(() => {
    const results = [];
    let planPrevDep = trip.startTime;
    let planTotalDist = 0;
    const actualStart = trip.actualStartTime || trip.startTime;
    let prevActualCum = 0;
    let lastActualDep = actualStart;
    trip.spots.forEach((spot, i) => {
      const calc = {
        plan: {},
        actual: {}
      };
      if (i === 0) {
        const planDep = spot.planStay ? addTimes(trip.startTime, spot.planStay) : trip.startTime;
        calc.plan = {
          arrival: null,
          departure: planDep,
          totalDist: 0
        };
        // Actual: use actualDep if entered, else actualStartTime
        const aDep = spot.actualDep || actualStart;
        calc.actual = {
          arrival: null,
          departure: aDep,
          totalDist: 0,
          stay: null,
          driveTime: null,
          segDist: null,
          entered: !!(spot.actualDep || trip.actualStartTime)
        };
        planPrevDep = planDep;
        lastActualDep = aDep;
      } else {
        // Plan: skip chain if planSkip
        if (spot.planSkip) {
          calc.plan = {
            arrival: null,
            departure: null,
            totalDist: null,
            skipped: true
          };
        } else {
          const pArr = addTimes(planPrevDep, spot.planTime);
          const pDep = addTimes(pArr, spot.planStay);
          planTotalDist += parseFloat(spot.planDist) || 0;
          calc.plan = {
            arrival: pArr,
            departure: pDep || pArr,
            totalDist: planTotalDist
          };
          planPrevDep = pDep || pArr;
        }

        // Actual: skip chain if actualSkip
        if (spot.actualSkip) {
          calc.actual = {
            arrival: null,
            departure: null,
            totalDist: null,
            segDist: null,
            stay: null,
            driveTime: null,
            skipped: true
          };
        } else {
          const aArr = spot.actualArr || "";
          const aDep = spot.actualDep || "";
          // Compute stay = dep - arr
          const stayMin = diffTimes(aArr, aDep);
          const stayStr = stayMin != null ? fmtClock(stayMin) : null;
          // Compute drive time = arr - last non-skipped departure
          const driveMin = diffTimes(lastActualDep, aArr);
          const driveStr = driveMin != null ? fmtClock(driveMin) : null;
          // Cumulative & segment distance
          const cumDist = parseFloat(spot.actualCumDist) || 0;
          const segDist = cumDist > 0 ? cumDist - prevActualCum : null;
          if (cumDist > 0) prevActualCum = cumDist;
          calc.actual = {
            arrival: aArr,
            departure: aDep || aArr,
            totalDist: cumDist,
            segDist,
            stay: stayStr,
            driveTime: driveStr
          };
          lastActualDep = aDep || aArr || lastActualDep;
        }
      }
